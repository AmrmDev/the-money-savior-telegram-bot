name: Develop CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: Test with Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go mod download
      - run: go build -v ./...

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Cobertura total: $COVERAGE%"
          THRESHOLD=90
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Cobertura de $COVERAGE% está abaixo do mínimo de $THRESHOLD%"
            exit 1
          else
            echo "✅ Cobertura de $COVERAGE% atende ao mínimo de $THRESHOLD%"
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  open-pr-main:
    name: Open PR to main
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Create PR if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr=$(gh pr list --head develop --base main --state open --json number --jq '.[0].number')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "Release: develop → main" \
              --body "PR aberto automaticamente após testes passarem na develop com cobertura mínima de 90%."
          else
            echo "PR #$existing_pr já existe, nada a fazer."
          fi